name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: 后端检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: 下载依赖
        run: go mod download

      - name: 代码格式检查
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "以下文件格式不规范："
            echo "$output"
            exit 1
          fi

      - name: 静态检查
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

      - name: 编译构建
        run: CGO_ENABLED=1 go build -o /dev/null ./cmd/server

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（仅验证，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: jiangming/panel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max